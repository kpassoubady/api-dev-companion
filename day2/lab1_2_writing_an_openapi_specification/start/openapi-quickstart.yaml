  #         string schema, and add a one-line description.
  # TODO 3: Add a 200 response whose content references the Greeting schema
  #         you define below in components/schemas.
  /api/v1/greetings/{name}:
    get:
      operationId: getGreeting
      parameters:
        - name: name
          in: path
          # TODO: required, schema, description go here
      responses:
        # TODO: '200' response goes here

components:
  schemas:
    # Worked example, referenced by the health path above.
    HealthStatus:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          description: UP if the service is healthy.
        service:
          type: string
          description: The service identifier.

