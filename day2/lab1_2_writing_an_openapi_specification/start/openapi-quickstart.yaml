openapi: 3.1.0
info:
  title: API Dev Quickstart
  description: Health check and greeting endpoints for the Fundamentals of API Development quickstart API.
  version: v1
servers:
  - url: http://localhost:8080
    description: Local quickstart API

paths:
  # Worked example. Read this fully before touching the greetings path below.
  /api/v1/health:
    get:
      summary: Check service health
      description: Returns the current status of the quickstart service.
      operationId: getHealth
      responses:
        '200':
          description: The service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                healthy:
                  value:
                    status: UP
                    service: api-dev-quickstart

  # TODO 1: Add a summary and description for this operation.
